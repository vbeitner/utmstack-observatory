<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatory Feature Tour</title>
<style>
:root{--bg:#F4F7FA;--panel:#FFFFFF;--ink:#0E1A26;--ink2:#41566A;--muted:#6B8193;--line:#D6E0E8;--accent:#0A7FA0;--accent-ink:#FFFFFF;--spot:#0A7FA0;--shadow:0 6px 24px rgba(14,26,38,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070A0F;--panel:#0E1620;--ink:#EAF7FF;--ink2:#B9CCD8;--muted:#8299AB;--line:#1F3142;--accent:#35E7FF;--accent-ink:#04121A;--spot:#35E7FF;--shadow:0 6px 24px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#070A0F;--panel:#0E1620;--ink:#EAF7FF;--ink2:#B9CCD8;--muted:#8299AB;--line:#1F3142;--accent:#35E7FF;--accent-ink:#04121A;--spot:#35E7FF;--shadow:0 6px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:17px;letter-spacing:.04em}
header .sub{color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px 24px;max-width:1500px;margin:0 auto}
.stage{position:relative;background:#000;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);align-self:start}
.stage.mobile{max-width:390px;justify-self:center;width:100%}
.stage img{display:block;width:100%;height:auto}
.spot{position:absolute;border:2px solid var(--spot);border-radius:6px;background:transparent;cursor:pointer;padding:0;transition:box-shadow .2s,background .2s}
.spot:hover,.spot.on{background:rgba(53,231,255,.12);box-shadow:0 0 0 4px rgba(53,231,255,.25)}
.spot .n{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--spot);color:var(--accent-ink);font:700 12px/22px system-ui,sans-serif;text-align:center}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:var(--shadow);align-self:start;position:sticky;top:16px}
aside .step{color:var(--muted);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
aside h2{margin:4px 0 8px;font-size:20px;line-height:1.25}
aside p{margin:0 0 12px;color:var(--ink2)}
ol.notes{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.notes li{display:flex;gap:10px;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
ol.notes li:hover,ol.notes li.on{border-color:var(--line);background:var(--bg)}
ol.notes .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 12px/22px system-ui,sans-serif;text-align:center}
ol.notes b{display:block;font-size:14px}
ol.notes span{color:var(--ink2);font-size:13.5px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{height:38px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px system-ui,sans-serif;cursor:pointer}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.on{background:var(--accent)}
.foot{color:var(--muted);font-size:12.5px;margin-top:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:980px){.wrap{grid-template-columns:1fr;padding:16px}aside{position:static}}
</style>
</head>
<body>
<header>
  <div><h1>UTMSTACK OBSERVATORY</h1><div class="sub">Feature tour · version 1.21.0 · sample data</div></div>
  <div class="sub">← → keys to move</div>
</header>
<div class="wrap">
  <div class="stage" id="stage"><img id="shot" alt=""></div>
  <aside>
    <div class="step" id="stepNo"></div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <ol class="notes" id="notes"></ol>
    <div class="nav"><button id="prev">Back</button><button id="next" class="primary">Next</button></div>
    <div class="dots" id="dots"></div>
    <div class="foot">All screens use the built-in demo mode: a fictional organisation and documentation-range IP addresses.<br>© 2026 Victor Beitner. All rights reserved.</div>
  </aside>
</div>
<script>
var TOUR = [{"img": "../media/screens/01-overview.jpg", "title": "One screen for the whole SIEM", "text": "The Overview answers the daily questions in seconds: is every log source reporting, how busy is the SIEM, is anything being flagged, and are logs arriving on time.", "mobile": false, "spots": [{"label": "Data sources", "text": "Sources that reported in the last 10 minutes. Silent sources are named here the moment they stop.", "box": {"x": 2.94, "y": 35.23, "w": 21.47, "h": 1.88}}, {"label": "Events", "text": "Events stored in the period, the change against the previous period and the peak rate.", "box": {"x": 27.22, "y": 35.23, "w": 21.41, "h": 1.88}}, {"label": "Alerts", "text": "Alerts by severity. Click for the filterable alert list.", "box": {"x": 51.44, "y": 35.23, "w": 21.41, "h": 1.88}}, {"label": "Ingest lag", "text": "How fresh the newest event is. Click for the delay per source.", "box": {"x": 75.66, "y": 35.23, "w": 21.41, "h": 1.88}}, {"label": "SIEM health", "text": "UTMStack's own database health. Click for a plain-language explanation and the fix.", "box": {"x": 25.67, "y": 5.85, "w": 8.72, "h": 2}}, {"label": "Time range", "text": "Live, 1 h, 6 h or 24 h for the counters, donut, rules and alert list.", "box": {"x": 63.76, "y": 5.15, "w": 9.08, "h": 3.4}}, {"label": "Alert rules", "text": "The rules raising the most alerts. Click one to open its alerts.", "box": {"x": 67.73, "y": 72.25, "w": 13.57, "h": 3.4}}]}, {"img": "../media/screens/02-live-map.jpg", "title": "Live map of firewall traffic and attacks", "text": "Every connection the firewalls log is drawn as an arc to the remote city. Attackers found in server and Microsoft 365 logs are plotted too. Red is blocked, yellow is VPN, purple is Tor.", "mobile": false, "spots": [{"label": "Window", "text": "Draw the last 1, 5 or 15 minutes.", "box": {"x": 51.83, "y": 20.25, "w": 13.03, "h": 3.4}}, {"label": "Source", "text": "Firewall, Microsoft 365, Google, Windows, Linux or syslog, or everything at once.", "box": {"x": 2.56, "y": 25.3, "w": 31.1, "h": 3.4}}, {"label": "Direction", "text": "Inbound, outbound or both.", "box": {"x": 34.28, "y": 25.3, "w": 13.97, "h": 3.4}}, {"label": "Outcome", "text": "Only allowed or only denied traffic.", "box": {"x": 48.88, "y": 25.3, "w": 13.03, "h": 3.4}}, {"label": "Network", "text": "Isolate traffic from VPN ranges, Tor exit nodes or hosting providers.", "box": {"x": 2.56, "y": 29.7, "w": 18.6, "h": 3.4}}, {"label": "Port", "text": "Type 22, 3389 or any port to see where that traffic comes from and goes to.", "box": {"x": 21.79, "y": 29.7, "w": 12.98, "h": 3.4}}, {"label": "Blocked ticker", "text": "The newest blocked connections, with VPN, Tor and hosting badges. Hover a row to find it on the map.", "box": {"x": 67.6, "y": 62.68, "w": 29.96, "h": 28.5}}]}, {"img": "../media/screens/03-map-tor.jpg", "title": "Tor and VPN traffic at a glance", "text": "Address lists for VPN providers, datacenters and Tor exit nodes are downloaded and refreshed automatically, so anonymised traffic stands out in its own colour.", "mobile": false, "spots": []}, {"img": "../media/screens/04-map-port-22.jpg", "title": "Who is knocking on port 22?", "text": "A port filter turns the map into an exposure check: every SSH attempt in the last minute, where it came from and which site it targeted.", "mobile": false, "spots": []}, {"img": "../media/screens/05-map-street-zoom.jpg", "title": "Street-level context", "text": "Zoom in and a street map appears beneath the arcs. IP location is city-level, so this adds context rather than pinpointing a building.", "mobile": false, "spots": []}, {"img": "../media/screens/22-attacker.jpg", "title": "Click an attacker: every port it tried", "text": "One click on a blocked connection shows what that address did in the last 24 hours: the ports it tried with their service names, how many were denied or allowed, the sites and addresses it reached, then reputation and WHOIS. Late replies to your own connections are counted apart, so the list shows real attempts only.", "mobile": false, "spots": [{"label": "Activity", "text": "Connections, denied vs allowed, first and last seen, and the ports tried on your side.", "box": {"x": 36.44, "y": 19.7, "w": 62.19, "h": 80.3}}]}, {"img": "../media/screens/07-alerts-for-rule.jpg", "title": "From a rule to its alerts in one click", "text": "Filter alerts by severity, source, rule or free text, and page through the history.", "mobile": false, "spots": [{"label": "Severity", "text": "High, Medium or Low.", "box": {"x": 36.44, "y": 12.25, "w": 5.25, "h": 3.4}}, {"label": "Source", "text": "One data source or all of them.", "box": {"x": 42.31, "y": 12.25, "w": 11, "h": 3.4}}, {"label": "Rule", "text": "One alert rule.", "box": {"x": 53.94, "y": 12.25, "w": 15, "h": 3.4}}, {"label": "Search", "text": "Free text across alert names, descriptions and addresses.", "box": {"x": 69.56, "y": 12.25, "w": 19.36, "h": 3.4}}]}, {"img": "../media/screens/08-alert-detail.jpg", "title": "Alert detail with a recommended action", "text": "Each alert explains what happened and what to do, in plain language, with every stored field, live IP reputation from AbuseIPDB and VirusTotal, and WHOIS for each public address.", "mobile": false, "spots": [{"label": "The alert", "text": "Rule, severity, status, MITRE ATT&CK technique and the affected site.", "box": {"x": 41.76, "y": 1.8, "w": 16.61, "h": 3}}]}, {"img": "../media/screens/09-data-sources.jpg", "title": "Every data source, and when it last reported", "text": "Event counts, share, a 24-hour sparkline and status per source. Switch to By type to compare firewalls, servers and cloud.", "mobile": false, "spots": []}, {"img": "../media/screens/10-source-detail.jpg", "title": "One source in depth", "text": "Event history, the alerts the source raised and its most recent raw events.", "mobile": false, "spots": []}, {"img": "../media/screens/11-ingest-lag.jpg", "title": "Are logs arriving on time?", "text": "The delay between a device logging an event and UTMStack storing it, per source, with an explanation of what is normal.", "mobile": false, "spots": []}, {"img": "../media/screens/12-cluster-health.jpg", "title": "SIEM health in plain language", "text": "When OpenSearch turns yellow or red, the panel says whether data is at risk, why, and the exact commands that fix it. Copy diagnostics gives your support provider everything at once.", "mobile": false, "spots": []}, {"img": "../media/screens/20-apply-fix.jpg", "title": "Fix a yellow SIEM with one click", "text": "When OpenSearch turns yellow because of replica copies a one-server cluster can never place, enter your password and press Apply fix. Each step is shown with its result. A separate, narrow account makes only these changes; it cannot read or delete data.", "mobile": false, "spots": []}, {"img": "../media/screens/13-trends.jpg", "title": "30 days of history", "text": "Hourly history and daily and weekly comparisons, kept in the dashboard's own database because UTMStack keeps raw logs for about a day.", "mobile": false, "spots": [{"label": "Metric", "text": "Events, alerts or AI traffic.", "box": {"x": 80.36, "y": 2.46, "w": 15.14, "h": 3.4}}, {"label": "Daily comparison", "text": "Last 24 hours against the 24 before.", "box": {"x": 47.69, "y": 37.42, "w": 50.94, "h": 21.95}}, {"label": "Weekly comparison", "text": "Last 7 days against the 7 before.", "box": {"x": 47.69, "y": 64.58, "w": 50.94, "h": 21.95}}]}, {"img": "../media/screens/14-reports.jpg", "title": "Reports for management", "text": "PDF and HTML reports on demand or every day: key figures, top rules, recent alerts with MITRE ATT&CK techniques, top blocked countries and storage health.", "mobile": false, "spots": [{"label": "Generate now", "text": "A report for the last 24 hours, ready in seconds.", "box": {"x": 56.44, "y": 10.22, "w": 7.27, "h": 3.6}}]}, {"img": "../media/screens/21-report.jpg", "title": "Reports ready for management", "text": "Every report carries the logo and the copyright notice on each page, opens with key figures and plain-language key findings, then covers alerts, blocked attackers and the ports they tried, and who connected to whom.", "mobile": false, "spots": []}, {"img": "../media/screens/16-edit-layout.jpg", "title": "Your layout, your screens", "text": "Move and resize panels, add widgets and screens, and choose which screens rotate on the NOC wall. Save a layout as everyone's default, or keep it personal.", "mobile": false, "spots": [{"label": "Add widget", "text": "Choose from the widget catalogue.", "box": {"x": 58.99, "y": 14.4, "w": 5.39, "h": 3.6}}, {"label": "Add screen", "text": "A new tab with its own layout.", "box": {"x": 64.87, "y": 14.4, "w": 5.39, "h": 3.6}}, {"label": "On wall", "text": "Include this screen in Wall-mode rotation.", "box": {"x": 75.71, "y": 14.4, "w": 4.92, "h": 3.6}}, {"label": "Move", "text": "Drag a panel by its handle.", "box": {"x": 92.04, "y": 20.1, "w": 3.9, "h": 2.6}}]}, {"img": "../media/screens/15-settings.jpg", "title": "Settings without a restart", "text": "Login, reputation API keys, support contact, map locations, AI-traffic hosts and the report schedule. Keys are write-only and never shown again.", "mobile": false, "spots": []}, {"img": "../media/screens/18-mobile-overview.jpg", "title": "Works on a phone", "text": "Panels stack on a small screen, and the map supports touch zoom and pan.", "mobile": true, "spots": []}];
var i = 0, stage = document.getElementById('stage'), shot = document.getElementById('shot');
function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }
function highlight(k){
  stage.querySelectorAll('.spot').forEach(function(s, j){ s.classList.toggle('on', j===k); });
  document.querySelectorAll('#notes li').forEach(function(s, j){ s.classList.toggle('on', j===k); });
}
function show(n){
  i = Math.max(0, Math.min(TOUR.length-1, n)); var t = TOUR[i];
  stage.classList.toggle('mobile', t.mobile);
  shot.src = t.img; shot.alt = t.title;
  document.getElementById('stepNo').textContent = 'Step ' + (i+1) + ' of ' + TOUR.length;
  document.getElementById('title').textContent = t.title;
  document.getElementById('text').textContent = t.text;
  stage.querySelectorAll('.spot').forEach(function(s){ s.remove(); });
  var notes = document.getElementById('notes'); notes.textContent = '';
  t.spots.forEach(function(sp, k){
    var b = el('button', 'spot'); b.setAttribute('aria-label', sp.label);
    b.style.left = sp.box.x + '%'; b.style.top = sp.box.y + '%'; b.style.width = sp.box.w + '%'; b.style.height = sp.box.h + '%';
    b.appendChild(el('span', 'n', k+1));
    b.addEventListener('click', function(){ highlight(k); });
    b.addEventListener('mouseenter', function(){ highlight(k); });
    stage.appendChild(b);
    var li = el('li'); li.appendChild(el('span', 'n', k+1));
    var d = el('div'); d.appendChild(el('b', null, sp.label)); d.appendChild(el('span', null, sp.text)); li.appendChild(d);
    li.addEventListener('mouseenter', function(){ highlight(k); }); li.addEventListener('click', function(){ highlight(k); });
    notes.appendChild(li);
  });
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').textContent = i === TOUR.length-1 ? 'Start again' : 'Next';
  document.querySelectorAll('#dots button').forEach(function(d, j){ d.classList.toggle('on', j===i); d.setAttribute('aria-current', j===i ? 'step' : 'false'); });
  try { history.replaceState(null, '', '#' + (i+1)); } catch(_){}
}
TOUR.forEach(function(t, j){ var d = el('button'); d.setAttribute('aria-label', 'Step ' + (j+1) + ': ' + t.title); d.addEventListener('click', function(){ show(j); }); document.getElementById('dots').appendChild(d); });
document.getElementById('prev').addEventListener('click', function(){ show(i-1); });
document.getElementById('next').addEventListener('click', function(){ show(i === TOUR.length-1 ? 0 : i+1); });
document.addEventListener('keydown', function(e){ if(e.key==='ArrowRight') show(i+1); if(e.key==='ArrowLeft') show(i-1); });
TOUR.forEach(function(t){ new Image().src = t.img; });
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
